backend:
  name: git-gateway
  branch: main

# This makes the login screen match your site.
site_url: https://REPLACE-WITH-YOUR-LIVE-SITE-URL
logo_url: /images/gallery/33541.jpg

media_library:
  name: default

collections:

  - name: "gallery"
    label: "Store Gallery"
    label_singular: "Photo"
    folder: "content/gallery"
    create: true
    delete: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    media_folder: "/images/gallery"
    public_folder: "/images/gallery"
    fields:
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Slug (leave as-is, or short id like 'newphoto1')", name: "slug", widget: "string", required: false, default: "photo" }

